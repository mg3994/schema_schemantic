name: schema_schemantic
description: A command-line application and generator for Schema.org JSON-LD definitions with package:schemantic.
version: 1.0.0

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  equatable: ^2.0.7
  http: ^1.6.0
  json_annotation: ^4.12.0
  path: ^1.9.0
  schemantic: ^1.0.0

dev_dependencies:
  build_runner: ^2.4.0
  json_serializable: ^6.14.1
  lints: ^6.0.0
  schemantic_builder: ^1.0.0
  test: ^1.25.6
